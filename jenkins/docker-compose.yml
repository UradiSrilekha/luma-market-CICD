# Start Jenkins:  cd jenkins && docker compose up -d --build
services:
  jenkins:
    build: .
    container_name: jenkins
    user: root                      # lets Jenkins use the host's docker.sock
    ports:
      - "8090:8080"                 # Jenkins UI
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
